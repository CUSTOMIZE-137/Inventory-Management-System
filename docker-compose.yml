services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:change-me@db:5432/inventory_db
      JWT_SECRET: replace-this-with-a-random-secret-at-least-32-characters
      ACCESS_TOKEN_MINUTES: 30
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.cli init-roles &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:

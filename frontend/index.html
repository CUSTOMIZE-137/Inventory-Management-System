<!DOCTYPE html>
<html lang="en" class="h-full bg-[#120D0E] text-stone-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Management System</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#EE1C26',
              redDark: '#C4121B',
              redDeep: '#8C0D14',
              gold: '#F9DB27',
              goldDark: '#D9BC12',
              orange: '#F6982B',
              charcoal: '#120D0E',
              surface: '#1C1416',
              card: '#241A1C',
              border: '#38282B',
              cream: '#FFFDF7'
            }
          }
        }
      }
    };
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #120D0E;
      color: #F5F2EB;
    }
    .brand-gradient-bar {
      background: linear-gradient(90deg, #EE1C26 0%, #F6982B 52%, #F9DB27 100%);
    }
    .brand-hero-bg {
      background:
        radial-gradient(circle at 15% 20%, rgba(238, 28, 38, 0.22), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(249, 219, 39, 0.16), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(246, 152, 43, 0.10), transparent 60%),
        #120D0E;
    }
    .logo-medallion {
      background: radial-gradient(circle at 50% 35%, #FFFFFF 0%, #FFF9E6 100%);
      box-shadow: 0 4px 20px -2px rgba(238, 28, 38, 0.35), 0 0 0 2px #F9DB27;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1C1416;
    }
    ::-webkit-scrollbar-thumb {
      background: #4A3337;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #EE1C26;
    }
  </style>
</head>
<body class="h-full selection:bg-[#EE1C26] selection:text-white">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const API_BASE = window.location.origin.includes(":8000")
      ? ""
      : "http://127.0.0.1:8000";

    const LOGO_SRC = "logo.png";

    function BrandLogo({ size = "md", className = "" }) {
      const sizes = {
        sm: "w-9 h-9 p-1 rounded-xl",
        md: "w-11 h-11 p-1.5 rounded-xl",
        lg: "w-16 h-16 p-2 rounded-2xl",
        xl: "w-24 h-24 p-2.5 rounded-3xl",
      };
      return (
        <div
          className={`logo-medallion inline-flex items-center justify-center shrink-0 overflow-hidden transition-transform duration-200 hover:scale-105 ${sizes[size] || sizes.md} ${className}`}
          title="Company Logo"
        >
          <img
            src={LOGO_SRC}
            alt="Company Logo"
            className="w-full h-full object-contain select-none"
            onError={(e) => {
              if (!e.target.dataset.fallback && API_BASE) {
                e.target.dataset.fallback = "1";
                e.target.src = `${API_BASE}/logo.png`;
              }
            }}
          />
        </div>
      );
    }

    function Badge({ children, color = "slate" }) {
      const colors = {
        emerald: "bg-emerald-500/15 text-emerald-300 border-emerald-500/30",
        amber: "bg-[#F6982B]/20 text-[#F9DB27] border-[#F6982B]/40",
        gold: "bg-[#F9DB27]/20 text-[#F9DB27] border-[#F9DB27]/40",
        rose: "bg-[#EE1C26]/20 text-rose-200 border-[#EE1C26]/40",
        indigo: "bg-[#EE1C26]/15 text-[#F9DB27] border-[#EE1C26]/35",
        slate: "bg-[#2C2023] text-stone-300 border-[#3E2D31]",
      };
      return (
        <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${colors[color] || colors.slate}`}>
          {children}
        </span>
      );
    }

    function App() {
      const [token, setToken] = useState(() => localStorage.getItem("ims_token") || "");
      const [me, setMe] = useState(null);
      const [activeTab, setActiveTab] = useState("dashboard");
      const [toast, setToast] = useState(null);
      const [loading, setLoading] = useState(false);

      // Login state
      const [email, setEmail] = useState("admin@example.org");
      const [password, setPassword] = useState("AdminPassword123!");

      // Data states
      const [items, setItems] = useState([]);
      const [units, setUnits] = useState([]);
      const [categories, setCategories] = useState([]);
      const [departments, setDepartments] = useState([]);
      const [locations, setLocations] = useState([]);
      const [vendors, setVendors] = useState([]);
      const [donors, setDonors] = useState([]);
      const [unitConversions, setUnitConversions] = useState([]);
      const [stock, setStock] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [purchaseOrders, setPurchaseOrders] = useState([]);
      const [requisitions, setRequisitions] = useState([]);
      const [donations, setDonations] = useState([]);
      const [careLogs, setCareLogs] = useState([]);
      const [stockTakes, setStockTakes] = useState([]);
      const [lowStock, setLowStock] = useState([]);
      const [valuation, setValuation] = useState({ total_value: 0, items: [] });
      const [consumption, setConsumption] = useState([]);
      const [users, setUsers] = useState([]);
      const [roles, setRoles] = useState([]);

      const notify = (msg, type = "info") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const apiFetch = useCallback(async (path, options = {}) => {
        const headers = {
          "Content-Type": "application/json",
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...(options.headers || {}),
        };
        const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
        if (res.status === 401) {
          localStorage.removeItem("ims_token");
          setToken("");
          setMe(null);
          throw new Error("Session expired or invalid credentials");
        }
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(typeof err.detail === "string" ? err.detail : JSON.stringify(err.detail));
        }
        return res.json();
      }, [token]);

      const loadAll = useCallback(async () => {
        if (!token) return;
        setLoading(true);
        try {
          const profile = await apiFetch("/api/auth/me");
          setMe(profile);
          const perms = new Set(profile.permissions || []);

          const promises = [];
          if (perms.has("catalog:read")) {
            promises.push(
              apiFetch("/api/items?include_inactive=true").then(setItems),
              apiFetch("/api/units").then(setUnits),
              apiFetch("/api/categories").then(setCategories),
              apiFetch("/api/departments").then(setDepartments),
              apiFetch("/api/vendors?include_inactive=true").then(setVendors),
              apiFetch("/api/donors?include_inactive=true").then(setDonors),
              apiFetch("/api/unit-conversions").then(setUnitConversions)
            );
          }
          if (perms.has("inventory:read")) {
            promises.push(
              apiFetch("/api/locations?include_inactive=true").then(setLocations),
              apiFetch("/api/stock").then(setStock),
              apiFetch("/api/transactions?limit=50").then(setTransactions),
              apiFetch("/api/purchase-orders").then(setPurchaseOrders),
              apiFetch("/api/donations").then(setDonations),
              apiFetch("/api/care-logs").then(setCareLogs),
              apiFetch("/api/stock-takes").then(setStockTakes)
            );
          }
          promises.push(apiFetch("/api/requisitions").then(setRequisitions).catch(() => {}));
          if (perms.has("reports:read")) {
            promises.push(
              apiFetch("/api/reports/low-stock").then(setLowStock),
              apiFetch("/api/reports/valuation").then(setValuation),
              apiFetch("/api/reports/consumption?days=30").then(setConsumption)
            );
          }
          if (perms.has("users:manage")) {
            promises.push(
              apiFetch("/api/users").then(setUsers),
              apiFetch("/api/roles").then(setRoles)
            );
          }
          await Promise.all(promises);
        } catch (err) {
          notify(err.message, "error");
        } finally {
          setLoading(false);
        }
      }, [token, apiFetch]);

      useEffect(() => {
        loadAll();
      }, [loadAll]);

      const handleLogin = async (e) => {
        e.preventDefault();
        try {
          const data = await apiFetch("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password }),
          });
          localStorage.setItem("ims_token", data.access_token);
          setToken(data.access_token);
          notify("Signed in", "success");
        } catch (err) {
          notify(err.message, "error");
        }
      };

      const handleLogout = () => {
        localStorage.removeItem("ims_token");
        setToken("");
        setMe(null);
      };

      if (!token || !me) {
        return (
          <div className="min-h-full flex flex-col justify-between brand-hero-bg">
            <div className="h-1.5 w-full brand-gradient-bar" />
            <div className="flex-1 flex items-center justify-center p-6">
              <div className="w-full max-w-md bg-[#1C1416]/95 border border-[#38282B] rounded-2xl shadow-2xl overflow-hidden">
                <div className="h-1.5 w-full brand-gradient-bar" />
                <div className="p-8">
                  <div className="flex flex-col items-center text-center mb-6">
                    <BrandLogo size="xl" className="mb-4" />
                    <span className="px-3 py-0.5 rounded-full text-[11px] font-semibold tracking-wider uppercase bg-[#F9DB27]/15 text-[#F9DB27] border border-[#F9DB27]/30 mb-2">
                      Mukisa Foundation
                    </span>
                    <h1 className="text-2xl font-bold text-white tracking-tight">Stock Management System</h1>
                    <p className="text-xs text-stone-400 mt-1">Auditable Multi-Location Inventory &amp; Stock Control</p>
                  </div>

                  {toast && (
                    <div className={`mb-4 p-3 rounded-lg text-sm border ${toast.type === "error" ? "bg-[#EE1C26]/15 border-[#EE1C26]/40 text-rose-200" : "bg-[#F9DB27]/15 border-[#F9DB27]/40 text-[#F9DB27]"}`}>
                      {toast.msg}
                    </div>
                  )}

                  <form onSubmit={handleLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs font-medium text-stone-300 mb-1">Email Address</label>
                      <input
                        type="email"
                        required
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-lg bg-[#120D0E] border border-[#38282B] text-white focus:outline-none focus:border-[#F9DB27] focus:ring-1 focus:ring-[#F9DB27]/40 text-sm transition"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-stone-300 mb-1">Password</label>
                      <input
                        type="password"
                        required
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-lg bg-[#120D0E] border border-[#38282B] text-white focus:outline-none focus:border-[#F9DB27] focus:ring-1 focus:ring-[#F9DB27]/40 text-sm transition"
                      />
                    </div>
                    <button
                      type="submit"
                      className="w-full py-2.5 px-4 bg-[#EE1C26] hover:bg-[#C4121B] text-white font-semibold rounded-lg text-sm shadow-lg shadow-[#EE1C26]/25 transition flex items-center justify-center gap-2"
                    >
                      <span>Sign In</span>
                      <span className="text-[#F9DB27]">&rarr;</span>
                    </button>
                  </form>

                  <div className="mt-6 pt-5 border-t border-[#38282B] text-xs text-stone-400 space-y-1.5">
                    <p className="font-semibold text-stone-300">
                      Demo Accounts (Password: <code className="text-[#F9DB27]">AdminPassword123!</code>):
                    </p>
                    <div className="flex flex-wrap gap-1.5 pt-1">
                      {["admin@example.org", "manager@example.org", "requester@example.org"].map((acct) => (
                        <button
                          key={acct}
                          type="button"
                          onClick={() => { setEmail(acct); setPassword("AdminPassword123!"); }}
                          className={`px-2.5 py-1 rounded-md border text-xs font-medium transition ${
                            email === acct
                              ? "bg-[#EE1C26]/20 border-[#EE1C26] text-[#F9DB27]"
                              : "bg-[#241A1C] border-[#38282B] hover:border-[#F6982B]/60 text-stone-200"
                          }`}
                        >
                          {acct.split("@")[0]}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <footer className="py-3 text-center text-[11px] text-stone-500">
              Inventory &amp; Stock Management System
            </footer>
          </div>
        );
      }

      const itemMap = Object.fromEntries(items.map((i) => [i.id, i]));
      const vendorMap = Object.fromEntries(vendors.map((v) => [v.id, v]));
      const isAdministrator = me.roles.includes("system_administrator");
      const isManager = me.roles.includes("manager");
      const isRequester = me.roles.includes("requester");

      const navTabs = [
        ["dashboard", isRequester ? "Available Stock" : "Stock Dashboard"],
        ...(!isRequester ? [["catalog", "Stock Items"]] : []),
        ...(isManager ? [["pos", "Stock Replenishment"], ["requisitions", "Stock Requests"]] : []),
        ...(me.permissions.includes("reports:read") ? [["reports", "Stock Reports"]] : []),
        ...(isAdministrator ? [["users", "System Users"]] : []),
      ];

      return (
        <div className="min-h-full flex flex-col bg-[#120D0E]">
          {/* Brand Top Ribbon */}
          <div className="h-1.5 w-full brand-gradient-bar sticky top-0 z-30" />

          {/* Top Navigation */}
          <header className="border-b border-[#38282B] bg-[#1C1416]/95 backdrop-blur sticky top-1.5 z-20 shadow-lg shadow-black/30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-6">
                <div
                  onClick={() => setActiveTab("dashboard")}
                  className="flex items-center gap-3 cursor-pointer group"
                >
                  <BrandLogo size="md" />
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-bold text-white tracking-tight group-hover:text-[#F9DB27] transition">
                        Stock Management
                      </span>
                      <span className="hidden sm:inline-block w-2 h-2 rounded-full bg-[#EE1C26] ring-2 ring-[#F9DB27]/60" />
                    </div>
                    <div className="text-[11px] font-medium text-[#F6982B]">
                      Stock Availability & Control
                    </div>
                  </div>
                </div>
                <nav className="hidden md:flex items-center gap-1">
                  {navTabs.map(([id, label]) => (
                    <button
                      key={id}
                      onClick={() => setActiveTab(id)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                        activeTab === id
                          ? "bg-[#EE1C26] text-white shadow-md shadow-[#EE1C26]/30 ring-1 ring-[#F9DB27]/50"
                          : "text-stone-300 hover:text-[#F9DB27] hover:bg-[#241A1C]"
                      }`}
                    >
                      {label}
                    </button>
                  ))}
                </nav>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={loadAll}
                  className="px-3 py-1.5 rounded-lg bg-[#241A1C] hover:bg-[#2F2225] border border-[#38282B] hover:border-[#F9DB27]/50 text-xs font-medium text-[#F9DB27] transition"
                >
                  {loading ? "Refreshing..." : "Refresh"}
                </button>
                <div className="text-right hidden sm:block">
                  <div className="text-xs font-semibold text-white">{me.name}</div>
                  <div className="text-[11px] text-[#F9DB27]/80">{me.roles.join(", ") || "no-role"}</div>
                </div>
                <button
                  onClick={handleLogout}
                  className="px-3 py-1.5 rounded-lg bg-[#EE1C26]/15 hover:bg-[#EE1C26] text-rose-200 hover:text-white text-xs font-semibold border border-[#EE1C26]/40 transition"
                >
                  Sign Out
                </button>
              </div>
            </div>

            {/* Mobile Navigation Bar */}
            <div className="md:hidden flex items-center gap-1 px-4 pb-2.5 overflow-x-auto">
              {navTabs.map(([id, label]) => (
                <button
                  key={id}
                  onClick={() => setActiveTab(id)}
                  className={`px-2.5 py-1 rounded-md text-xs font-medium whitespace-nowrap ${
                    activeTab === id
                      ? "bg-[#EE1C26] text-white ring-1 ring-[#F9DB27]/50"
                      : "text-stone-400 hover:text-white bg-[#241A1C]"
                  }`}
                >
                  {label}
                </button>
              ))}
            </div>
          </header>

          {toast && (
            <div className="fixed bottom-5 right-5 z-50 max-w-md px-4 py-3 rounded-xl shadow-2xl border text-sm bg-[#1C1416] border-[#F9DB27] text-white flex items-center gap-2.5">
              <span className="w-2.5 h-2.5 rounded-full bg-[#EE1C26] shrink-0" />
              <span>{toast.msg}</span>
            </div>
          )}

          {/* Main Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
            {activeTab === "dashboard" && (
              <DashboardView
                items={items}
                stock={stock}
                lowStock={lowStock}
                valuation={valuation}
                requisitions={requisitions}
                canWithdraw={me.permissions.includes("inventory:withdraw")}
                apiFetch={apiFetch}
                onRefresh={loadAll}
                notify={notify}
              />
            )}
            {activeTab === "catalog" && (
              <CatalogView
                items={items}
                units={units}
                categories={categories}
                departments={departments}
                vendors={vendors}
                unitConversions={unitConversions}
                apiFetch={apiFetch}
                onRefresh={loadAll}
                notify={notify}
              />
            )}
            {activeTab === "pos" && (
              <PurchaseOrdersView
                purchaseOrders={purchaseOrders}
                vendors={vendors}
                items={items}
                itemMap={itemMap}
                vendorMap={vendorMap}
                apiFetch={apiFetch}
                onRefresh={loadAll}
                notify={notify}
              />
            )}
            {activeTab === "requisitions" && (
              <RequisitionsView
                requisitions={requisitions}
                items={items}
                itemMap={itemMap}
                me={me}
                apiFetch={apiFetch}
                onRefresh={loadAll}
                notify={notify}
              />
            )}
            {activeTab === "reports" && (
              <ReportsView
                lowStock={lowStock}
                valuation={valuation}
                consumption={consumption}
                token={token}
                categories={categories}
                apiFetch={apiFetch}
                notify={notify}
              />
            )}
            {activeTab === "users" && (
              <UsersView
                users={users}
                roles={roles}
                departments={departments}
                apiFetch={apiFetch}
                onRefresh={loadAll}
                notify={notify}
              />
            )}
          </main>

          {/* Branded Footer */}
          <footer className="border-t border-[#38282B] bg-[#1C1416]/80 py-4 mt-8">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-stone-400">
              <div className="flex items-center gap-2.5">
                <span className="font-medium text-stone-200">Inventory Management System</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="inline-block w-2.5 h-2.5 rounded-full bg-[#EE1C26]" title="Brand Red #EE1C26" />
                <span className="inline-block w-2.5 h-2.5 rounded-full bg-[#F9DB27]" title="Brand Gold #F9DB27" />
                <span className="inline-block w-2.5 h-2.5 rounded-full bg-[#F6982B]" title="Brand Orange #F6982B" />
                <span className="ml-1 text-stone-400">Auditable Multi-Location Stock Control</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    function DashboardView({ items, stock, lowStock, valuation, requisitions, canWithdraw, apiFetch, onRefresh, notify }) {
      const [withdrawItemId, setWithdrawItemId] = useState("");
      const [withdrawQuantity, setWithdrawQuantity] = useState("1");
      const [withdrawRecipient, setWithdrawRecipient] = useState("");
      const totalUnits = stock.reduce((acc, s) => acc + parseFloat(s.quantity || 0), 0);
      const pendingReqs = requisitions.filter((r) => r.status !== "completed" && r.status !== "rejected").length;
      const availableByItem = stock.reduce((result, balance) => {
        result[balance.item_id] = (result[balance.item_id] || 0) + Number(balance.quantity || 0);
        return result;
      }, {});
      const withdraw = async (event) => {
        event.preventDefault();
        try {
          await apiFetch("/api/stock/withdraw", {
            method: "POST",
            headers: { "Idempotency-Key": `withdraw-${Date.now()}` },
            body: JSON.stringify({
              item_id: withdrawItemId || (items[0] && items[0].id),
              quantity: withdrawQuantity,
              recipient: withdrawRecipient,
            }),
          });
          setWithdrawQuantity("1");
          setWithdrawRecipient("");
          notify("Stock withdrawn and availability updated", "success");
          onRefresh();
        } catch (err) {
          notify(err.message, "error");
        }
      };

      return (
        <div className="space-y-6">
          {/* Branded Welcome Banner */}
          <div className="relative overflow-hidden rounded-2xl bg-gradient-to-r from-[#281518] via-[#1C1416] to-[#291F12] border border-[#38282B] p-5 sm:p-6 shadow-xl">
            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div>
                <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-[#EE1C26]/20 text-[#F9DB27] border border-[#EE1C26]/40">
                  Live Stock Overview
                </span>
                <h2 className="text-lg sm:text-xl font-bold text-white mt-1">
                  Inventory &amp; Stock Control Center
                </h2>
                <p className="text-xs text-stone-300 mt-0.5">
                  Real-time stock balances, valuation, low-stock alerts, and stock movements.
                </p>
              </div>
              <div className="flex items-center gap-2 text-xs">
                <div className="px-3 py-2 rounded-xl bg-[#120D0E]/80 border border-[#38282B] text-right">
                  <div className="text-[11px] text-stone-400">Stock SKUs</div>
                  <div className="text-sm font-bold text-[#F6982B]">{items.length}</div>
                </div>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="p-5 rounded-xl bg-[#1C1416] border border-[#38282B] border-t-2 border-t-[#EE1C26]">
              <div className="text-xs text-stone-400">Catalog Valuation (Standard Cost)</div>
              <div className="text-2xl font-bold text-white mt-1">

    function StockView({ items, locations, stock, transactions, itemMap, locMap, apiFetch, onRefresh, notify }) {
      const [txType, setTxType] = useState("receipt");
      const [itemId, setItemId] = useState("");
      const [locationId, setLocationId] = useState("");
      const [qty, setQty] = useState("5");
      const [reason, setReason] = useState("");
      const [recipient, setRecipient] = useState("");
      const [reference, setReference] = useState("");

      const [trItemId, setTrItemId] = useState("");
      const [srcLoc, setSrcLoc] = useState("");
      const [dstLoc, setDstLoc] = useState("");
      const [trQty, setTrQty] = useState("2");
      const [trReason, setTrReason] = useState("Rebalance stock");

      const submitTx = async (e) => {
        e.preventDefault();
        try {
          const selItem = itemId || (items[0] && items[0].id);
          const selLoc = locationId || (locations[0] && locations[0].id);
          const rawQty = Math.abs(parseFloat(qty));
          const signedQty = txType === "issue" ? -rawQty : rawQty;
          await apiFetch("/api/transactions", {
            method: "POST",
            headers: { "Idempotency-Key": `ui-tx-${Date.now()}` },
            body: JSON.stringify({
              type: txType,
              movements: [{ item_id: selItem, location_id: selLoc, quantity_delta: String(signedQty) }],
              reason,
              reference: reference || null,
              recipient: txType === "issue" ? recipient : null,
            }),
          });
          setReason("");
          setReference("");
          notify("Stock transaction posted", "success");
          onRefresh();
        } catch (err) {
          notify(err.message, "error");
        }
      };

      const submitTransfer = async (e) => {
        e.preventDefault();
        try {
          await apiFetch("/api/transfers", {
            method: "POST",
            headers: { "Idempotency-Key": `ui-tr-${Date.now()}` },
            body: JSON.stringify({
              item_id: trItemId || (items[0] && items[0].id),
              source_location_id: srcLoc || (locations[0] && locations[0].id),
              destination_location_id: dstLoc || (locations[1] && locations[1].id),
              quantity: String(trQty),
              reason: trReason,
            }),
          });
          notify("Transfer completed atomically", "success");
          onRefresh();
        } catch (err) {
          notify(err.message, "error");
        }
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <form onSubmit={submitTx} className="bg-[#1C1416] border border-[#38282B] rounded-xl p-5 space-y-3">
              <h3 className="text-sm font-semibold text-white">Post Stock Receipt / Issue / Adjustment</h3>
              <div className="grid grid-cols-2 gap-2">
                <select
                  value={txType}
                  onChange={(e) => setTxType(e.target.value)}
                  className="px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white"
                >
                  <option value="receipt">Receipt (+)</option>
                  <option value="issue">Issue (-)</option>
                  <option value="adjustment">Adjustment</option>
                </select>
                <input
                  type="number"
                  step="0.001"
                  required
                  value={qty}
                  onChange={(e) => setQty(e.target.value)}
                  placeholder="Quantity"
                  className="px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white"
                />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <select
                  value={itemId}
                  onChange={(e) => setItemId(e.target.value)}
                  className="px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white"
                >
                  {items.map((i) => (
                    <option key={i.id} value={i.id}>{i.sku} - {i.name}</option>
                  ))}
                </select>
                <select
                  value={locationId}
                  onChange={(e) => setLocationId(e.target.value)}
                  className="px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white"
                >
                  {locations.map((l) => (
                    <option key={l.id} value={l.id}>{l.name}</option>
                  ))}
                </select>
              </div>
              {txType === "issue" && (
                <input
                  required
                  placeholder="Recipient (Department or Person)"

    function PurchaseOrdersView({ purchaseOrders, vendors, items, locations, itemMap, vendorMap, apiFetch, onRefresh, notify }) {
      const [vendorId, setVendorId] = useState("");
      const [reference, setReference] = useState("");
      const [itemId, setItemId] = useState("");
      const [orderedQty, setOrderedQty] = useState("10");
      const [unitCost, setUnitCost] = useState("12.50");
      const [recvLocId, setRecvLocId] = useState("");

      const createPO = async (e) => {
        e.preventDefault();
        try {
          await apiFetch("/api/purchase-orders", {
            method: "POST",
            body: JSON.stringify({
              vendor_id: vendorId || (vendors[0] && vendors[0].id),
              reference,
              lines: [
                {
                  item_id: itemId || (items[0] && items[0].id),
                  ordered_qty: orderedQty,
                  unit_cost: unitCost,
                },
              ],
            }),
          });
          setReference("");
          notify("Purchase Order created", "success");
          onRefresh();
        } catch (err) {
          notify(err.message, "error");
        }
      };

      const receiveRemaining = async (po, line) => {
        const remaining = Number(line.ordered_qty) - Number(line.received_qty);
        if (remaining <= 0) return;
        const targetLoc = recvLocId || (locations[0] && locations[0].id);
        if (!targetLoc) {
          notify("Create a location first", "error");
          return;
        }
        try {
          await apiFetch(`/api/purchase-orders/${po.id}/receive`, {
            method: "POST",
            headers: { "Idempotency-Key": `po-recv-${po.id}-${line.id}-${Date.now()}` },
            body: JSON.stringify({
              reason: `Received against ${po.reference}`,
              lines: [
                {
                  purchase_order_line_id: line.id,
                  location_id: targetLoc,
                  quantity: String(remaining),
                },
              ],
            }),
          });
          notify(`Received ${remaining} units into inventory`, "success");
          onRefresh();
        } catch (err) {
          notify(err.message, "error");
        }
      };

      return (
        <div className="space-y-6">
          <form onSubmit={createPO} className="bg-[#1C1416] border border-[#38282B] rounded-xl p-5 space-y-3">
            <h3 className="text-sm font-semibold text-white">Create Purchase Order</h3>
            <div className="grid grid-cols-1 sm:grid-cols-5 gap-2.5">
              <select
                value={vendorId}
                onChange={(e) => setVendorId(e.target.value)}
                className="px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white"
              >
                {vendors.map((v) => (
                  <option key={v.id} value={v.id}>{v.name}</option>
                ))}
              </select>
              <input
                required
                placeholder="PO Reference (e.g. PO-501)"
                value={reference}
                onChange={(e) => setReference(e.target.value)}
                className="px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white"
              />
              <select
                value={itemId}
                onChange={(e) => setItemId(e.target.value)}
                className="px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white"
              >
                {items.map((i) => (
                  <option key={i.id} value={i.id}>{i.sku} - {i.name}</option>
                ))}
              </select>
              <input
                type="number"
                step="0.001"
                required
                value={orderedQty}
                onChange={(e) => setOrderedQty(e.target.value)}
                placeholder="Ordered Qty"
                className="px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white"
              />
              <button className="py-2 px-4 bg-[#EE1C26] hover:bg-[#C4121B] text-white rounded-lg text-xs font-semibold transition">
                Issue PO
              </button>
            </div>
          </form>

          <div className="bg-[#1C1416] border border-[#38282B] rounded-xl p-5 space-y-4">
            <div className="flex items-center justify-between">
              <h3 className="text-sm font-semibold text-white">Purchase Orders ({purchaseOrders.length})</h3>
              <div className="flex items-center gap-2 text-xs">
                <span className="text-stone-400">Receive into:</span>
                <select
                  value={recvLocId}
                  onChange={(e) => setRecvLocId(e.target.value)}
                  className="px-2.5 py-1 rounded bg-[#120D0E] border border-[#38282B] text-white"
                >
                  {locations.map((l) => (
                    <option key={l.id} value={l.id}>{l.name}</option>
                  ))}
                </select>
              </div>
            </div>

            <div className="space-y-3">
              {purchaseOrders.map((po) => (
                <div key={po.id} className="p-4 rounded-xl bg-[#120D0E] border border-[#38282B] space-y-2">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2.5">
                      <span className="font-mono text-xs font-semibold text-[#F9DB27]">{po.reference}</span>
                      <span className="text-xs text-stone-400">{vendorMap[po.vendor_id]?.name || po.vendor_id}</span>
                    </div>
                    <Badge color={po.status === "received" ? "emerald" : po.status === "partially_received" ? "amber" : "indigo"}>
                      {po.status}

                    {po.lines.map((line) => {
                      const rem = Number(line.ordered_qty) - Number(line.received_qty);
                      return (
                        <div key={line.id} className="py-2 flex items-center justify-between">
                          <div>
                            <span className="text-white font-medium">{itemMap[line.item_id]?.name || line.item_id}</span>
                            <span className="text-stone-400 ml-3">

    function DonationsCareView({
      donors, donations, careLogs, items, categories, locations, departments, me,
      apiFetch, onRefresh, notify,
    }) {
      const currentYear = new Date().getFullYear();
      const [reportYear, setReportYear] = useState(String(currentYear));
      const [donationSummary, setDonationSummary] = useState(null);
      const [reportLoading, setReportLoading] = useState(false);
      const [donorName, setDonorName] = useState("");
      const [donorType, setDonorType] = useState("organization");
      const [donorEmail, setDonorEmail] = useState("");
      const [donationReference, setDonationReference] = useState("");
      const [donationDonor, setDonationDonor] = useState("");
      const [donationLines, setDonationLines] = useState([{ item_id: "", location_id: "", quantity: "1" }]);
      const [careLocation, setCareLocation] = useState("");
      const [careDepartment, setCareDepartment] = useState("");
      const [careActivity, setCareActivity] = useState("general_issue");
      const [careRecipient, setCareRecipient] = useState("");
      const [careLines, setCareLines] = useState([{ item_id: "", quantity: "1" }]);
      const itemMap = Object.fromEntries(items.map((item) => [item.id, item]));
      const donorMap = Object.fromEntries(donors.map((donor) => [donor.id, donor]));
      const categoryMap = Object.fromEntries(categories.map((category) => [category.id, category]));
      const canWriteCatalog = me.permissions.includes("catalog:write");
      const canTransact = me.permissions.includes("inventory:transact");

      useEffect(() => {
        let current = true;
        setReportLoading(true);
        const params = new URLSearchParams({ year: reportYear });
        apiFetch(`/api/donations/monthly-summary?${params}`)
          .then((summary) => {
            if (current) setDonationSummary(summary);
          })
          .catch((err) => {
            if (current) {
              setDonationSummary(null);
              notify(err.message, "error");
            }
          })
          .finally(() => {
            if (current) setReportLoading(false);
          });
        return () => {
          current = false;
        };
      }, [apiFetch, reportYear, donations]);

      const reportGroups = Object.values(
        (donationSummary?.rows || []).reduce((groups, row) => {
          const categoryId = row.category_id || "uncategorized";
          if (!groups[categoryId]) {
            groups[categoryId] = {
              id: categoryId,
              name: categoryMap[categoryId]?.name || "Uncategorized",
              rows: [],
              monthlyTotals: Array(12).fill(0),
              total: 0,
            };
          }
          const group = groups[categoryId];
          group.rows.push(row);
          row.monthly_quantities.forEach((quantity, index) => {
            group.monthlyTotals[index] += Number(quantity);
          });
          group.total += Number(row.total_quantity);
          return groups;
        }, {})
      ).sort((left, right) => left.name.localeCompare(right.name));
      const reportTotal = reportGroups.reduce((total, group) => total + group.total, 0);
      const reportItemCount = (donationSummary?.rows || []).length;
      const formatQuantity = (quantity) =>
        Number(quantity).toLocaleString(undefined, { maximumFractionDigits: 3 });

      const createDonor = async (e) => {
        e.preventDefault();
        try {
          await apiFetch("/api/donors", {
            method: "POST",
            body: JSON.stringify({
              name: donorName,
              donor_type: donorType,
              email: donorEmail || null,
            }),
          });
          setDonorName("");
          setDonorEmail("");
          notify("Donor saved", "success");
          onRefresh();
        } catch (err) {
          notify(err.message, "error");
        }
      };

      const createDonation = async (e) => {
        e.preventDefault();
        const lines = donationLines.map((line) => {
          const item = itemMap[line.item_id];
          if (!item || !line.location_id) return null;
          return {
            item_id: item.id,
            location_id: line.location_id,
            quantity: line.quantity,
            uom_code: item.uom_code,
          };
        });
        if (lines.some((line) => line === null)) {
          notify("Select an active item and location for every donation line", "error");
          return;
        }
        try {
          await apiFetch("/api/donations", {
            method: "POST",
            headers: { "Idempotency-Key": `don-${donationReference}` },
            body: JSON.stringify({
              donor_id: donationDonor || null,
              reference: donationReference,
              lines,
            }),
          });
          setDonationReference("");
          setDonationLines([{ item_id: "", location_id: "", quantity: "1" }]);
          notify("Donation received into stock", "success");
          onRefresh();
        } catch (err) {
          notify(err.message, "error");
        }
      };

      const createCareLog = async (e) => {
        e.preventDefault();
        const selectedLocation = careLocation || (locations[0] && locations[0].id);
        const lines = careLines.map((line) => {
          const item = itemMap[line.item_id];
          if (!item) return null;
          return {
            item_id: item.id,
            quantity: line.quantity,
            uom_code: item.uom_code,
          };
        });
        if (!selectedLocation || lines.some((line) => line === null)) {
          notify("Select an active item and location for every care line", "error");
          return;
        }
        try {
          await apiFetch("/api/care-logs", {
            method: "POST",
            body: JSON.stringify({
              department_id: careDepartment || null,
              location_id: selectedLocation,
              activity_type: careActivity,
              recipient: careRecipient,
              lines,
            }),
          });
          setCareRecipient("");
          setCareLines([{ item_id: "", quantity: "1" }]);
          notify("Care dispense recorded", "success");
          onRefresh();
        } catch (err) {
          notify(err.message, "error");
        }
      };

      const selectClass = "w-full px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white";
      const inputClass = "w-full px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white";

      return (
        <div className="space-y-6">
          <section className="bg-[#1C1416] border border-[#38282B] rounded-xl p-5 space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
              <div>
                <p className="text-[11px] uppercase tracking-[0.18em] text-[#F6982B] font-semibold">Donations in kind</p>
                <h2 className="text-lg font-bold text-white mt-1">Monthly Donations Register</h2>
                <p className="text-xs text-stone-400 mt-1">Monthly receipts by item, grouped by catalog category.</p>
              </div>
              <label className="text-xs text-stone-300 flex items-center gap-2">
                Reporting year
                <input
                  type="number"
                  min="2000"
                  max="2100"
                  value={reportYear}
                  onChange={(e) => {
                    if (e.target.value) setReportYear(e.target.value);
                  }}
                  className="w-24 px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-sm text-white"
                />
              </label>
            </div>

            {reportLoading && <p className="text-xs text-stone-400">Loading donation totals...</p>}

    function StockTakeView({ stockTakes, items, locations, apiFetch, onRefresh, notify, canTransact }) {
      const [title, setTitle] = useState("");
      const [locationId, setLocationId] = useState("");
      const [countLines, setCountLines] = useState([{ item_id: "", counted_qty: "0" }]);
      const itemMap = Object.fromEntries(items.map((item) => [item.id, item]));

      const createStockTake = async (e) => {
        e.preventDefault();
        const selectedLocation = locationId || (locations[0] && locations[0].id);
        if (!selectedLocation || countLines.some((line) => !line.item_id)) {
          notify("Select an active item and location for every count line", "error");
          return;
        }
        try {
          await apiFetch("/api/stock-takes", {
            method: "POST",
            body: JSON.stringify({
              title,
              location_id: selectedLocation,
              lines: countLines,
            }),
          });
          setTitle("");
          setCountLines([{ item_id: "", counted_qty: "0" }]);
          notify("Stock take saved; finalize to post its variance", "success");
          onRefresh();
        } catch (err) {
          notify(err.message, "error");
        }
      };

      const finalize = async (id) => {
        try {
          await apiFetch(`/api/stock-takes/${id}/finalize`, { method: "POST" });
          notify("Stock take reconciled", "success");
          onRefresh();
        } catch (err) {
          notify(err.message, "error");
        }
      };

      const selectClass = "px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white";
      return (
        <div className="space-y-5">
          {canTransact && (
            <form onSubmit={createStockTake} className="bg-[#1C1416] border border-[#38282B] rounded-xl p-5 space-y-3">
              <h3 className="text-sm font-semibold text-white">Start Stock Take</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                <input required maxLength="160" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Count session title" className={selectClass} />
                <select required value={locationId} onChange={(e) => setLocationId(e.target.value)} className={selectClass}>
                  <option value="">Select location</option>
                  {locations.filter((location) => location.is_active).map((location) => <option key={location.id} value={location.id}>{location.name}</option>)}
                </select>
              </div>
              <div className="space-y-2">
                {countLines.map((line, index) => (
                  <div key={index} className="grid grid-cols-1 sm:grid-cols-[1fr_180px_auto] gap-2">
                    <select required value={line.item_id} onChange={(e) => setCountLines((current) => current.map((entry, row) => row === index ? { ...entry, item_id: e.target.value } : entry))} className={selectClass}>
                      <option value="">Select item</option>
                      {items.filter((item) => item.is_active).map((item) => <option key={item.id} value={item.id}>{item.sku} · {item.name}</option>)}
                    </select>
                    <input type="number" min="0" step="0.001" required value={line.counted_qty} onChange={(e) => setCountLines((current) => current.map((entry, row) => row === index ? { ...entry, counted_qty: e.target.value } : entry))} placeholder="Counted quantity" className={selectClass} />
                    {countLines.length > 1 && <button type="button" onClick={() => setCountLines((current) => current.filter((_, row) => row !== index))} className="px-3 py-2 text-xs text-rose-300 border border-rose-900 rounded-lg">Remove</button>}
                  </div>
                ))}
              </div>
              <div className="flex gap-2">
                <button type="button" onClick={() => setCountLines((current) => [...current, { item_id: "", counted_qty: "0" }])} className="px-3 py-2 rounded-lg border border-[#38282B] text-[#F9DB27] text-xs">Add item</button>
                <button className="py-2 px-4 bg-[#EE1C26] hover:bg-[#C4121B] text-white rounded-lg text-xs font-semibold">Save Count</button>
              </div>
            </form>
          )}
          <section className="bg-[#1C1416] border border-[#38282B] rounded-xl p-5">
            <h3 className="text-sm font-semibold text-white mb-3">Stock-Take Sessions ({stockTakes.length})</h3>
            <div className="space-y-3">
              {stockTakes.map((take) => (
                <article key={take.id} className="p-4 rounded-lg bg-[#120D0E] border border-[#38282B]">
                  <div className="flex items-center justify-between gap-3">
                    <div><strong className="text-white">{take.title}</strong><div className="text-xs text-stone-400 mt-1">{locations.find((location) => location.id === take.location_id)?.name || take.location_id} · {new Date(take.created_at).toLocaleString()}</div></div>
                    <div className="flex items-center gap-2"><Badge color={take.status === "posted" ? "emerald" : "amber"}>{take.status}</Badge>{canTransact && take.status === "in_progress" && <button onClick={() => finalize(take.id)} className="px-3 py-1.5 rounded bg-[#F9DB27] text-[#120D0E] text-xs font-semibold">Finalize</button>}</div>
                  </div>
                  <div className="mt-3 space-y-1 text-xs text-stone-300">
                    {take.lines.map((line) => <div key={line.id}>{itemMap[line.item_id]?.name || line.item_id}: expected {Number(line.expected_qty).toFixed(3)}, counted {Number(line.counted_qty).toFixed(3)}, variance <strong className={Number(line.variance_qty) < 0 ? "text-rose-300" : "text-emerald-300"}>{Number(line.variance_qty).toFixed(3)}</strong></div>)}
                  </div>
                </article>
              ))}
              {!stockTakes.length && <p className="text-xs text-stone-500">No stock-take sessions recorded.</p>}
            </div>
          </section>
        </div>
      );
    }

    function ReportsView({ lowStock, valuation, consumption, categories, apiFetch, token, notify }) {
      const now = new Date();
      const [year, setYear] = useState(String(now.getFullYear()));
      const [month, setMonth] = useState(String(now.getMonth() + 1));
      const [categoryId, setCategoryId] = useState("");
      const [ledger, setLedger] = useState(null);

      const queryString = () => {
        const params = new URLSearchParams({ year, month });
        if (categoryId) params.set("category_id", categoryId);
        return params.toString();
      };
      const loadLedger = async () => {
        try {
          setLedger(await apiFetch(`/api/reports/monthly-ledger?${queryString()}`));
        } catch (err) {
          notify(err.message, "error");
        }
      };
      const downloadLedger = async () => {
        try {
          const response = await fetch(`${API_BASE}/api/reports/export?report_type=monthly-ledger&${queryString()}`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!response.ok) {
            const error = await response.json().catch(() => ({ detail: response.statusText }));
            throw new Error(error.detail || "CSV export failed");
          }
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = `inventory-monthly-ledger-${year}-${String(month).padStart(2, "0")}.csv`;
          anchor.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (err) {
          notify(err.message, "error");
        }
      };
      return (
        <div className="space-y-6">
          <section className="bg-[#1C1416] border border-[#38282B] rounded-xl p-5 space-y-4">
            <div className="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-3">
              <div>
                <h3 className="text-sm font-semibold text-white">Monthly Inventory Ledger</h3>
                <p className="text-xs text-stone-400 mt-1">Receipts, issues, adjustments, and closing stock from the auditable movement ledger.</p>
              </div>
              <div className="flex flex-wrap gap-2">
                <input type="number" min="2000" max="2100" value={year} onChange={(e) => setYear(e.target.value)} aria-label="Year" className="w-24 px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white" />
                <select value={month} onChange={(e) => setMonth(e.target.value)} aria-label="Month" className="px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white">
                  {Array.from({ length: 12 }, (_, index) => <option key={index + 1} value={index + 1}>{new Date(2000, index, 1).toLocaleString(undefined, { month: "long" })}</option>)}
                </select>
                <select value={categoryId} onChange={(e) => setCategoryId(e.target.value)} aria-label="Category" className="max-w-48 px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white">
                  <option value="">All categories</option>
                  {categories.map((category) => <option key={category.id} value={category.id}>{category.name}</option>)}
                </select>
                <button onClick={loadLedger} className="px-3 py-2 rounded-lg bg-[#EE1C26] hover:bg-[#C4121B] text-white text-xs font-semibold">Load Ledger</button>
                <button onClick={downloadLedger} className="px-3 py-2 rounded-lg border border-[#F9DB27]/50 text-[#F9DB27] text-xs font-semibold">Export CSV</button>
              </div>
            </div>
            {ledger && (
              <>
                <div className="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-6 gap-2">
                  {[
                    ["Opening", "opening_stock"],
                    ["Purchases", "purchased_qty"],
                    ["Donations", "donated_qty"],
                    ["Other receipts", "other_receipt_qty"],
                    ["Stock taken", "stock_taken"],
                    ["Closing", "closing_stock"],
                  ].map(([label, key]) => (
                    <div key={key} className="p-3 bg-[#120D0E] rounded-lg border border-[#38282B]">
                      <div className="text-[10px] uppercase text-stone-500">{label}</div>
                      <div className="text-sm font-semibold text-[#F9DB27]">{Number(ledger.summary?.[key] || 0).toFixed(3)}</div>
                    </div>
                  ))}
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full min-w-[1100px] text-left text-xs">
                    <thead className="text-stone-400 border-b border-[#38282B]">
                      <tr>
                        <th className="p-2">Item</th><th className="p-2 text-right">Opening</th><th className="p-2 text-right">Purchased</th><th className="p-2 text-right">Donated</th><th className="p-2 text-right">Other in</th><th className="p-2 text-right">Total</th><th className="p-2 text-right">Requisitions</th><th className="p-2 text-right">Care dispense</th><th className="p-2 text-right">Other out</th><th className="p-2 text-right">Adjust / transfer</th><th className="p-2 text-right">Closing</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#38282B]/60">
                      {ledger.rows.map((row) => (
                        <tr key={row.item_id}>
                          <td className="p-2"><span className="font-mono text-[#F9DB27]">{row.sku}</span><span className="ml-2 text-white">{row.name}</span></td>
                          {["opening_stock", "purchased_qty", "donated_qty", "other_receipt_qty", "total_stock", "requisition_issued_qty", "daily_dispensed_qty", "other_issued_qty", "net_adjustments_and_transfers", "closing_stock"].map((key) => <td key={key} className="p-2 text-right">{Number(row[key]).toFixed(3)}</td>)}
                        </tr>
                      ))}
                      {!ledger.rows.length && <tr><td colSpan="11" className="p-4 text-center text-stone-500">No active catalog items match the selected filters.</td></tr>}
                    </tbody>
                  </table>
                </div>
              </>
            )}
          </section>

          <div className="bg-[#1C1416] border border-[#38282B] rounded-xl p-5">
            <h3 className="text-sm font-semibold text-white mb-3">
              Standard-Cost Valuation Breakdown (Total: <span className="text-[#F9DB27]">${Number(valuation?.total_value || 0).toFixed(2)}</span>)
            </h3>
            <table className="w-full text-left text-xs">
              <thead className="text-stone-400 border-b border-[#38282B]">
                <tr>
                  <th className="pb-2">SKU</th>
                  <th className="pb-2">Item Name</th>
                  <th className="pb-2 text-right">On Hand</th>
                  <th className="pb-2 text-right">Unit Cost</th>
                  <th className="pb-2 text-right">Total Value</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-[#38282B]/60">
                {(valuation?.items || []).map((row) => (
                  <tr key={row.item_id}>
                    <td className="py-2 font-mono text-[#F9DB27]">{row.sku}</td>
                    <td className="py-2 text-white">{row.name}</td>
                    <td className="py-2 text-right">{Number(row.on_hand).toFixed(2)}</td>
                    <td className="py-2 text-right">${Number(row.unit_cost).toFixed(2)}</td>
                    <td className="py-2 text-right font-semibold text-[#F6982B]">${Number(row.total_value).toFixed(2)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div className="bg-[#1C1416] border border-[#38282B] rounded-xl p-5">
            <h3 className="text-sm font-semibold text-white mb-3">30-Day Consumption Report</h3>
            <table className="w-full text-left text-xs">
              <thead className="text-stone-400 border-b border-[#38282B]">
                <tr>
                  <th className="pb-2">SKU</th>
                  <th className="pb-2">Item Name</th>
                  <th className="pb-2 text-right">Total Consumed (30d)</th>
                  <th className="pb-2 text-right">Avg Daily Consumed</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-[#38282B]/60">
                {consumption.map((row) => (
                  <tr key={row.item_id}>
                    <td className="py-2 font-mono text-[#F9DB27]">{row.sku}</td>
                    <td className="py-2 text-white">{row.name}</td>
                    <td className="py-2 text-right">{Number(row.quantity_consumed).toFixed(2)}</td>
                    <td className="py-2 text-right text-stone-400">{Number(row.average_daily_consumed).toFixed(3)} / day</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function UsersView({ users, roles, departments, apiFetch, onRefresh, notify }) {
      const [email, setEmail] = useState("");
      const [name, setName] = useState("");
      const [password, setPassword] = useState("StrongPassword123!");
      const [role, setRole] = useState("warehouse_clerk");

      const createUser = async (e) => {
        e.preventDefault();
        try {
          await apiFetch("/api/users", {
            method: "POST",
            body: JSON.stringify({ email, name, password, roles: [role] }),
          });
          setEmail("");
          setName("");
          notify("User account created", "success");
          onRefresh();
        } catch (err) {
          notify(err.message, "error");
        }
      };

      return (
        <div className="space-y-6">
          <form onSubmit={createUser} className="bg-[#1C1416] border border-[#38282B] rounded-xl p-5 space-y-3">
            <h3 className="text-sm font-semibold text-white">Provision User Account</h3>
            <div className="grid grid-cols-1 sm:grid-cols-5 gap-2.5">
              <input
                type="email"
                required
                placeholder="Email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                className="px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white"
              />
              <input
                required
                placeholder="Full Name"
                value={name}
                onChange={(e) => setName(e.target.value)}
                className="px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white"
              />
              <input
                type="password"
                required
                minLength={12}
                placeholder="Password (12+ chars)"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                className="px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white"
              />
              <select
                value={role}
                onChange={(e) => setRole(e.target.value)}
                className="px-3 py-2 rounded-lg bg-[#120D0E] border border-[#38282B] text-xs text-white"
              >
                {roles.map((r) => (
                  <option key={r.name} value={r.name}>{r.name}</option>
                ))}
              </select>
              <button className="py-2 px-4 bg-[#EE1C26] hover:bg-[#C4121B] text-white rounded-lg text-xs font-semibold transition">
                Create User
              </button>
            </div>
          </form>

          <div className="bg-[#1C1416] border border-[#38282B] rounded-xl p-5">
            <h3 className="text-sm font-semibold text-white mb-3">Registered Users ({users.length})</h3>
            <table className="w-full text-left text-xs">
              <thead className="text-stone-400 border-b border-[#38282B]">
                <tr>
                  <th className="pb-2">Name</th>
                  <th className="pb-2">Email</th>
                  <th className="pb-2">Roles</th>
                  <th className="pb-2">Status</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-[#38282B]/60">
                {users.map((u) => (
                  <tr key={u.id}>
                    <td className="py-2.5 text-white font-medium">{u.name}</td>
                    <td className="py-2.5 text-stone-300">{u.email}</td>
                    <td className="py-2.5 space-x-1">
                      {u.roles.map((r) => (
                        <Badge key={r} color="gold">{r}</Badge>
                      ))}
                    </td>
                    <td className="py-2.5">
                      <Badge color={u.is_active ? "emerald" : "rose"}>
                        {u.is_active ? "Active" : "Disabled"}
                      </Badge>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

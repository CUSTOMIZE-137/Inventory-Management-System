server {
  listen 80;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

  # Baseline browser security headers matching the FastAPI backend middleware.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Block hidden dotfiles and JavaScript source maps in production.
  location ~ /\. {
    deny all;
    return 404;
  }

  location ~* \.map$ {
    deny all;
    return 404;
  }

  # Prevent caching of the PWA service worker and web manifest so updates roll out promptly.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Reverse-proxy API and health endpoints to the internal FastAPI container.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://backend:8000;
  }

  location = /ready {
    proxy_pass http://backend:8000;
  }

  # SPA fallback so deep client-side routes load index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
